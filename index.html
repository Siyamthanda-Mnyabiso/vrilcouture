  <title>VRILCOUTURE</title>
  <!-- Google tag (GA4 + Google Ads). Consent Mode: everything starts denied and
       is only granted once the visitor accepts the cookie notice. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CQBH0P8H4C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied'
    });
    try {
      if (localStorage.getItem('vc_cookie_consent') === 'granted') {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });
      }
    } catch (e) {}
    // Password-reset and email-confirmation links carry sign-in tokens in the
    // address. Keep those out of what is sent to Google.
    if (/access_token|refresh_token/.test(location.hash)) {
      gtag('set', 'page_location', location.origin + location.pathname);
    }
    gtag('js', new Date());
    gtag('config', 'G-CQBH0P8H4C');
    gtag('config', 'AW-18434709463');
  </script>
  <!-- Import fonts in HTML instead of CSS -->
  <!-- Just testing  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
